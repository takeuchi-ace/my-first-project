<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 体育会系社長・鬼塚 — Spiky hair, tanned, vest, orange tie, towel -->
  <!-- Shoulders / Vest -->
  <path d="M38 256 L58 188 C68 170, 93 158, 128 155 C163 158, 188 170, 198 188 L218 256 Z"
