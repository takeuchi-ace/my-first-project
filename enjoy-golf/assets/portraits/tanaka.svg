  <line x1="93" y1="204" x2="99" y2="204" stroke="#999" stroke-width="0.5"/>
  <line x1="93" y1="207" x2="99" y2="207" stroke="#999" stroke-width="0.5"/>
  <line x1="93" y1="210" x2="97" y2="210" stroke="#999" stroke-width="0.5"/>
